spring:
  application:
    name: Personal-Note-RAG
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.linxing.linxing_agent
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8080

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER}
  temperature: 0.3
  timeout-seconds: 180
  max-tokens: 8192
  providers:
    minimax:
      model: ${MINIMAX_MODEL}
      api-key: ${MINIMAX_API_KEY}
      base-url: ${MINIMAX_BASE_URL}
      group-id: ${MINIMAX_GROUP_ID}
    deepseek:
      model: ${DEEPSEEK_MODEL}
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL}
      return-thinking: true
      send-thinking: ${DEEPSEEK_SEND_THINKING:true}
    glm:
      model: ${GLM_MODEL}
      api-key: ${GLM_API_KEY}
      base-url: ${GLM_BASE_URL}
    kimi:
      model: ${KIMI_MODEL}
      api-key: ${KIMI_API_KEY}
      base-url: ${KIMI_BASE_URL}
    other1:
      model: ${OTHER1_MODEL}
      api-key: ${OTHER1_API_KEY}
      base-url: ${OTHER1_BASE_URL}

rag:
  store-path: ${RAG_STORE_PATH}
  vector-store:
    host: ${RAG_VECTOR_HOST}
    port: ${RAG_VECTOR_PORT}
    database: ${RAG_VECTOR_DATABASE}
    user: ${RAG_VECTOR_USER}
    password: ${RAG_VECTOR_PASSWORD}
    table: embeddings
    dimension: 512
  reranker:
    enabled: true
    batch-size: 8
    model-path: classpath:models/ms-marco-MiniLM-L-6-v2/model.onnx
    tokenizer-path: classpath:models/ms-marco-MiniLM-L-6-v2/tokenizer.json
  cache:
    doc-preview-ttl: ${RAG_CACHE_DOC_PREVIEW_TTL:3600}
    # session-messages-ttl / agent-steps-ttl 已随 P3 Runtime Mirror 落地停写旧键，保留仅供旧键自然过期观察
    session-messages-ttl: ${RAG_CACHE_SESSION_MSGS_TTL:1800}
    agent-steps-ttl: ${RAG_CACHE_AGENT_STEPS_TTL:3600}
    # P3 Runtime Mirror 统一 TTL（mirror:msgs / mirror:steps 共用，秒），默认 12h
    mirror-ttl: ${RAG_CACHE_MIRROR_TTL:43200}
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${PYTHON_SERVICE_TIMEOUT:120}
    enabled: ${PYTHON_SERVICE_ENABLED:true}
    image-store-dir: ${RAG_STORE_PATH}/chunk_images
    python-path: ${PYTHON_PATH:}
  semantic-enhancement:
    context:
      previous-nodes: ${RAG_SEMANTIC_PREV_NODES:2}
      next-nodes: ${RAG_SEMANTIC_NEXT_NODES:2}
      max-neighbor-chars: ${RAG_SEMANTIC_MAX_NEIGHBOR_CHARS:200}

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret-key: ${JWT_SECRET_KEY}
  ttl: ${JWT_TTL}
  token-name: ${JWT_TOKEN_NAME}

agent:
  skills:
    path: ${AGENT_SKILLS_PATH:}
  disclosure:
    threshold: 5
  tool:
    timeout-seconds: ${AGENT_TOOL_TIMEOUT_SECONDS:180}
    workflow-timeout-seconds: ${AGENT_TOOL_WORKFLOW_TIMEOUT_SECONDS:600}
  memory:
    # type/max-messages/max-tokens 于 2-B memory 退化为极简累加器后失效（AgentMemoryFactory 不再读）。
    # 运行时上下文保护改由 Recovery 入口 token 预算截断 + 2-D Rule Set/Projection 提供，此处保留键仅作占位，后续清理。
    type: ${AGENT_MEMORY_TYPE:window}
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:40}
    max-tokens: ${AGENT_MEMORY_MAX_TOKENS:32000}
  token:
    encoding: ${AGENT_TOKEN_ENCODING:cl100k_base}        # jtokkit 编码名：cl100k_base / o200k_base，DeepSeek/GLM/Kimi/Minimax 均走 OpenAI 兼容 BPE，近似可接受
    max-context: ${AGENT_TOKEN_MAX_CONTEXT:200000}       # 模型上下文最高上限，据此反推各级 Projection 阈值
  projection:
    thresholds:
      full-to-rewrite: ${AGENT_PROJECTION_FULL_TO_REWRITE:0.60}   # FULL → REWRITE_TOOL 线
      rewrite-to-snip: ${AGENT_PROJECTION_REWRITE_TO_SNIP:0.80}    # REWRITE_TOOL → SNIP_LOWVALUE 线
      snip-to-summary: ${AGENT_PROJECTION_SNIP_TO_SUMMARY:0.90}    # SNIP_LOWVALUE → SUMMARY 线
      summary-max-ratio: ${AGENT_PROJECTION_SUMMARY_MAX_RATIO:0.5} # Summary 压缩目标占 max-context 比例
    snip:
      enabled: ${AGENT_SNIP_ENABLED:true}                                   # Projection rule 异步产出总开关
      skip-turn-llm-enabled: ${AGENT_SNIP_SKIP_TURN_LLM_ENABLED:true}      # SkipTurn LLM ReAct 开关（false=只跑 Rewrite 纯规则）
      max-steps: ${AGENT_SNIP_MAX_STEPS:6}                                 # Snip 小循环最大 LLM 轮次（远小于主循环 20）
      executor:
        core-pool-size: ${AGENT_SNIP_CORE_POOL:2}
        max-pool-size: ${AGENT_SNIP_MAX_POOL:4}
        queue-capacity: ${AGENT_SNIP_QUEUE:32}
        thread-name-prefix: snip-
      rewrite:
        result-token-threshold: ${AGENT_SNIP_REWRITE_TOKEN_THRESHOLD:2000} # 读性质工具结果 token 超此值才产 RewriteToolRule
        read-only-tools:                                                       # 读性质工具白名单（结果可被 Rewrite 精简）；写性质工具不在此列
          - search_knowledge_base
          - web_search
          - resolve
  web-search:
    tavily:
      api-key: ${TAVILY_API_KEY}
      max-results: ${TAVILY_MAX_RESULTS:5}

logging:
  level:
    root: INFO
    org.linxing.linxing_agent: INFO
    org.apache.ibatis.mapper: WARN
