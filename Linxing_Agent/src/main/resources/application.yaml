spring:
  application:
    name: Personal-Note-RAG
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/vectordb
    username: postgres
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.linxing.linxing_agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8080

rag:
  vector-store:
    table: embeddings
    dimension: 512
  llm:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.3
    timeout-seconds: 60
    max-tokens: 2048
  reranker:
    enabled: true
    batch-size: 8

logging:
  level:
    root: INFO
    org.linxing.linxing_agent: INFO
    org.apache.ibatis.mapper: WARN
