spring:
  application:
    name: Personal-Note-RAG
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/vectordb
    username: postgres
    password: 230801
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.linxing.linxing_agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8080

rag:
  store-path: D:\JavaProjects\Linxing\files_store
  embedding:
    model: bge-small-zh
    chunk-size: 800
    chunk-overlap: 200
  vector-store:
    host: localhost
    port: 5432
    database: vectordb
    user: postgres
    password: 230801
    table: embeddings
    dimension: 512
  llm:
    provider: minimax
    api-key: sk-cp-PLFrECVGzujOXyxJ40ZGpIDZ-izAZ0ut68DPTep4-uJEm1xNkfFeN9X4m5XlbdefulJMXPNzfnvUsa6oHIBKrNS5oYl1_czfZEfQ5EsLZgIjjgBkGL0xo0k
    base-url: https://api.minimax.chat/v1
    group-id: 2038083649219338792
    model: MiniMax-M2.7
    temperature: 0.3
    timeout-seconds: 60
    max-tokens: 2048
  search:
    default-top-k: 5
    recall-size: 20
  reranker:
    enabled: true
    model-path: D:\JavaProjects\Linxing\models\ms-marco-MiniLM-L-6-v2\model.onnx
    tokenizer-path: D:\JavaProjects\Linxing\models\ms-marco-MiniLM-L-6-v2\tokenizer.json
    batch-size: 8

logging:
  level:
    root: INFO
    org.linxing.linxing_agent: INFO
    org.apache.ibatis.mapper: WARN
