spring:
  application:
    name: Personal-Note-RAG
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DATABASE:vectordb}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.linxing.linxing_agent
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8080

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:deepseek}
  temperature: 0.3
  timeout-seconds: 180
  max-tokens: 8192
  # 0814 重试机制改造：LLM 调用失败重试配置
  # max-retries 作用于非流式模型的 langchain4j 内置重试次数；退避参数供主对话循环内单轮重试使用
  retry:
    max-retries: ${LLM_RETRY_MAX_RETRIES:2}
    initial-backoff-ms: ${LLM_RETRY_INITIAL_BACKOFF_MS:500}
    backoff-multiplier: ${LLM_RETRY_BACKOFF_MULTIPLIER:2}
    jitter-ratio: ${LLM_RETRY_JITTER_RATIO:0.2}
  providers:
    minimax:
      model: ${MINIMAX_MODEL:MiniMax-M2.7}
      api-key: ${MINIMAX_API_KEY:}
      base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
      group-id: ${MINIMAX_GROUP_ID:}
    deepseek:
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      return-thinking: true
      send-thinking: ${DEEPSEEK_SEND_THINKING:true}
    glm:
      model: ${GLM_MODEL:glm-4.6v-flash}
      api-key: ${GLM_API_KEY:}
      base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    kimi:
      model: ${KIMI_MODEL:moonshot-v1-8k}
      api-key: ${KIMI_API_KEY:}
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
    other1:
      model: ${OTHER1_MODEL:MiniMax-M3}
      api-key: ${OTHER1_API_KEY:}
      base-url: ${OTHER1_BASE_URL:https://jisu.aicodee.com/v1}

rag:
  store-path: ${RAG_STORE_PATH:./files_store}
  vector-store:
    host: ${RAG_VECTOR_HOST:localhost}
    port: ${RAG_VECTOR_PORT:5432}
    database: ${RAG_VECTOR_DATABASE:vectordb}
    user: ${RAG_VECTOR_USER:postgres}
    password: ${RAG_VECTOR_PASSWORD:}
    table: embeddings
    # embedding 输出维度，必须与 api.embedding 实际输出一致（bge-m3=1024）
    dimension: ${RAG_VECTOR_DIMENSION:1024}
  search:
    # Rerank API relevance_score（0-1 归一化）的相关性阈值，低于此值的结果舍弃，可能导致 RAG 为空
    # 0 表示关闭阈值过滤；bge-reranker-v2-m3 经验保守值 0.35，后续按真实语料校准
    score-threshold: 0.35
  # ===== Embedding / Rerank API =====
  # api-key 为空或 enabled=false 时对应模型不构建/不启用，RAG 向量化/重排序降级不可用（应用可正常启动）
  api:
    # OpenAI 兼容 /v1/embeddings（langchain4j OpenAiEmbeddingModel）
    embedding:
      enabled: ${RAG_API_EMBEDDING_ENABLED:false}
      base-url: ${RAG_API_EMBEDDING_BASE_URL}
      api-key: ${RAG_API_EMBEDDING_API_KEY:}
      model: ${RAG_API_EMBEDDING_MODEL}
      timeout-seconds: ${RAG_API_EMBEDDING_TIMEOUT:120}
      max-retries: ${RAG_API_EMBEDDING_MAX_RETRIES:2}
    # /v1/rerank（Cohere/Jina 兼容，响应 results[].relevance_score 已归一化 [0,1]）
    reranker:
      enabled: ${RAG_API_RERANKER_ENABLED:false}
      base-url: ${RAG_API_RERANKER_BASE_URL}
      api-key: ${RAG_API_RERANKER_API_KEY:}
      model: ${RAG_API_RERANKER_MODEL3}
      batch-size: ${RAG_API_RERANKER_BATCH_SIZE:8}
      timeout-seconds: ${RAG_API_RERANKER_TIMEOUT:120}
      max-retries: ${RAG_API_RERANKER_MAX_RETRIES:2}
  cache:
    doc-preview-ttl: ${RAG_CACHE_DOC_PREVIEW_TTL:3600}
    # session-messages-ttl / agent-steps-ttl 保留仅供旧键自然过期观察
    session-messages-ttl: ${RAG_CACHE_SESSION_MSGS_TTL:1800}
    agent-steps-ttl: ${RAG_CACHE_AGENT_STEPS_TTL:3600}
    #Runtime Mirror 统一 TTL（mirror:msgs / mirror:steps 共用，秒），默认 12h
    mirror-ttl: ${RAG_CACHE_MIRROR_TTL:43200}
    #chat:response:{requestId} 幂等缓存 TTL（秒），默认 35 分钟，略大于 SSE 超时(30 分钟)以覆盖空闲 reset 窗口
    chat-response-ttl: ${RAG_CACHE_CHAT_RESPONSE_TTL:2100}
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:18000}
    timeout-seconds: ${PYTHON_SERVICE_TIMEOUT:600}
    enabled: ${PYTHON_SERVICE_ENABLED:true}
    image-store-dir: ${RAG_STORE_PATH}/chunk_images
    python-path: ${PYTHON_PATH:}
  semantic-enhancement:
    context:
      previous-nodes: ${RAG_SEMANTIC_PREV_NODES:2}
      next-nodes: ${RAG_SEMANTIC_NEXT_NODES:2}
      max-neighbor-chars: ${RAG_SEMANTIC_MAX_NEIGHBOR_CHARS:200}

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  ttl: ${JWT_TTL:18000000}
  token-name: ${JWT_TOKEN_NAME:Authorization}

agent:
  skills:
    path: ${AGENT_SKILLS_PATH:}
  disclosure:
    threshold: 5
  tool:
    timeout-seconds: ${AGENT_TOOL_TIMEOUT_SECONDS:180}
    workflow-timeout-seconds: ${AGENT_TOOL_WORKFLOW_TIMEOUT_SECONDS:600}
  memory:
    # Long-term Memory Workspace：受限沙盒，按 userId 子目录隔离
    longterm:
      workspace:
        root-dir: ${AGENT_MEMORY_LONGTERM_ROOT:./files_store/memory}
      worker:
        max-steps: ${AGENT_MEMORY_WORKER_MAX_STEPS:6}   # Memory Worker ReAct 小循环最大 LLM 轮次
  token:
    encoding: ${AGENT_TOKEN_ENCODING:cl100k_base}        # jtokkit 编码名：cl100k_base / o200k_base，DeepSeek/GLM/Kimi/Minimax 均走 OpenAI 兼容 BPE，近似可接受
    max-context: ${AGENT_TOKEN_MAX_CONTEXT:200000}       # 模型上下文最高上限，据此反推各级 Projection 阈值
  projection:
    thresholds:                                                   # Projection 阈值，按 max-context 计算比例
      full-to-rewrite: ${AGENT_PROJECTION_FULL_TO_REWRITE:0.60}   # FULL → REWRITE_TOOL 线
      rewrite-to-snip: ${AGENT_PROJECTION_REWRITE_TO_SNIP:0.80}    # REWRITE_TOOL → SNIP_LOWVALUE 线
      snip-to-summary: ${AGENT_PROJECTION_SNIP_TO_SUMMARY:0.90}    # SNIP_LOWVALUE → SUMMARY 线
      summary-max-ratio: ${AGENT_PROJECTION_SUMMARY_MAX_RATIO:0.3} # Summary 压缩目标占 max-context 比例（0723_当前未使用）
    snip:
      enabled: ${AGENT_SNIP_ENABLED:true}                                   # Projection rule 异步产出总开关
      skip-turn-llm-enabled: ${AGENT_SNIP_SKIP_TURN_LLM_ENABLED:true}      # SkipTurn LLM ReAct 开关（false=只跑 Rewrite 纯规则）
      max-steps: ${AGENT_SNIP_MAX_STEPS:6}                                 # Snip 小循环最大 LLM 轮次
      executor:
        core-pool-size: ${AGENT_SNIP_CORE_POOL:2}
        max-pool-size: ${AGENT_SNIP_MAX_POOL:4}
        queue-capacity: ${AGENT_SNIP_QUEUE:32}
        thread-name-prefix: snip-
      rewrite:
        result-token-threshold: ${AGENT_SNIP_REWRITE_TOKEN_THRESHOLD:200} # 工具结果 token 超此值才产 RewriteToolRule
        read-only-tools:
          - search_knowledge_base
          - web_search
          - resolve
  web-search:
    tavily:
      api-key: ${TAVILY_API_KEY:}
      max-results: ${TAVILY_MAX_RESULTS:5}

# ==================== Langfuse 观测 ====================
# 自定义 ChatModelListener 直连 OTel SDK → Langfuse OTLP 端点，凭据从原 quarkus 段迁移至此。
# enabled=false 时构建 no-op Tracer，不透传任何 span，系统零开销。当前已置 true 用于冒烟验证，
# 需要临时关闭可在启动时设 LANGFUSE_ENABLED=false。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  # OTLP HTTP 端点。注意：Java SDK 程序化 setEndpoint() 不自动追加信号路径（环境变量自动装配才会），
  # 而 Langfuse 只服务完整路径 .../api/public/otel/v1/traces；base 形式 .../api/public/otel 直 POST 会 404。
  endpoint: ${LANGFUSE_ENDPOINT}
  public-key: ${LANGFUSE_PUBLIC_KEY}
  secret-key: ${LANGFUSE_SECRET_KEY}
  environment: ${LANGFUSE_ENVIRONMENT:dev}
  version: ${LANGFUSE_VERSION:0.0.1-SNAPSHOT}
  trace-offline-calls: ${LANGFUSE_TRACE_OFFLINE_CALLS:false}

logging:
  level:
    root: INFO
    org.linxing.linxing_agent: INFO
    org.apache.ibatis.mapper: WARN
